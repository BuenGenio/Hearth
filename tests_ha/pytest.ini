# Tests for the Home Assistant integration in custom_components/hearth.
# They need Home Assistant, which the hub's own .venv does not have:
#
#   uv venv --python 3.14 .venv-ha
#   uv pip install --python .venv-ha/bin/python pytest-homeassistant-custom-component
#   .venv-ha/bin/python -m pytest tests_ha
#
# Having this file here makes tests_ha its own pytest root, so the hub's
# pyproject.toml settings and tests/conftest.py stay out of the way.
[pytest]
asyncio_mode = auto
pythonpath = ..
testpaths = .
