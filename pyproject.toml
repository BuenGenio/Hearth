[project]
name = "hearth"
version = "0.1.0"
description = "Always-on household listening hub for Home Assistant: sound guard, wake phrases, transcription and summaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "soxr>=0.5",
    "httpx>=0.27",
    "paho-mqtt>=2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Native model runtimes. Kept optional so hearth.capture / hearth.features can be
# reused (and unit-tested) without them.
models = ["ai-edge-litert>=2.0", "sherpa-onnx>=1.12", "sentencepiece>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
hearth = "hearth.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the downloaded model files (HEARTH_MODELS)"]
