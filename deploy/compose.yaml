# Hearth hub. Copy .env.example to .env and hearth.example.toml to hearth.toml first.
services:
  hearth:
    build: ${HEARTH_SRC:-..}
    image: hearth:local
    container_name: hearth
    restart: unless-stopped
    # Host networking: the hub must reach the MQTT broker and bind the API to
    # specific host addresses (tailnet, management network).
    network_mode: host
    user: "1000:${AUDIO_GID:-29}"          # the host's `audio` group: getent group audio
    # The whole /dev/snd directory plus a cgroup rule (ALSA is char major 116),
    # so a receiver plugged in later is usable without restarting the container.
    volumes:
      - /dev/snd:/dev/snd
      - ${HEARTH_CONFIG_FILE:-./hearth.toml}:/config/hearth.toml:ro
      - ${HEARTH_DATA:-./data}:/data
    device_cgroup_rules:
      - "c 116:* rmw"
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/London}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
